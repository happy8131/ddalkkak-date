spring:
  application:
    name: ddalkkak-backend
  profiles:
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE # API JSON 필드는 snake_case (PRD API 스펙)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway로만 변경한다
  flyway:
    enabled: true

app:
  # 외부 API 키는 환경 변수로만 받는다. 비어 있어도 앱은 뜨고 호출 시점에 실패한다
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  ai:
    # openai-compatible(기본: Groq, AIMLAPI 등) 또는 anthropic
    provider: ${AI_PROVIDER:openai-compatible}
  llm:
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:qwen/qwen3.8-27b}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}

# Sentry (KAN-55). SDK는 SENTRY_DSN이 있을 때만 켜진다. dsn과 release는 여기에 쓰지 않고
# 환경 변수 SENTRY_DSN, SENTRY_RELEASE를 스프링이 그대로 바인딩한다 (DSN이 비어 있는 값으로 켜지는 것을 막는다)
sentry:
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1} # 비용을 고려해 낮게. 0이면 트레이싱 끔
  send-default-pii: false # IP, 쿠키, 사용자 정보를 자동으로 보내지 않는다 (guest_id 쿠키 보호)
  # GlobalExceptionHandler(@RestControllerAdvice)가 예외를 먼저 처리하면 Sentry 리졸버가 호출되지 않아
  # 500 오류가 수집되지 않는다. 가장 앞(HIGHEST_PRECEDENCE)에 두고, 4xx는 SentryEventScrubber가 걸러낸다
  exception-resolver-order: -2147483648

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: ${app.cors.allowed-origins}
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true

# springdoc (Swagger UI: /swagger-ui.html, 명세: /v3/api-docs). 운영에서는 application-prod.yml에서 끈다
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
