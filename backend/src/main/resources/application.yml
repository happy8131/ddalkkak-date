spring:
  application:
    name: ddalkkak-backend
  profiles:
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE # API JSON 필드는 snake_case (PRD API 스펙)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway로만 변경한다
  flyway:
    enabled: true

app:
  # 외부 API 키는 환경 변수로만 받는다. 비어 있어도 앱은 뜨고 호출 시점에 실패한다
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  ai:
    # openai-compatible(기본: Groq, AIMLAPI 등) 또는 anthropic
    provider: ${AI_PROVIDER:openai-compatible}
  llm:
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:qwen/qwen3.8-27b}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: ${app.cors.allowed-origins}
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true
