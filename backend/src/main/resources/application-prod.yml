# 운영용: 비밀 값은 모두 환경 변수(ECS 태스크 정의의 Secrets Manager/SSM)로 주입한다
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoint:
    health:
      show-details: never

# API 문서(Swagger UI, /v3/api-docs)는 운영에 노출하지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
